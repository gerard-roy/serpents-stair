<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#071013">
  <title>Serpent's Stair</title>
  <meta name="description" content="Snakes and ladders as a 3D climb up a storm-lit jungle temple. Four climbers, seven serpents, and one fire at the top.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23071013'/%3E%3Cpath d='M6 26h6v-5h6v-5h6v-5' fill='none' stroke='%23D8A94A' stroke-width='2.500'/%3E%3Ccircle cx='24' cy='7' r='3' fill='%23E2622B'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Spectral:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
</head>
<body>
  <canvas id="scene" tabindex="-1" aria-label="The temple"></canvas>
  <div id="hud"></div>
    <div id="loading" style="position:fixed;inset:0;display:grid;place-items:center;background:#071013;z-index:50;transition:opacity .5s">
      <div style="width:min(260px,60vw);text-align:center;color:#D8A94A;font:600 13px Georgia,serif;letter-spacing:.3em">SERPENT'S STAIR
        <div style="margin-top:14px;height:2px;background:rgba(216,169,74,.2);overflow:hidden"><i style="display:block;height:100%;width:40%;background:#D8A94A;animation:ld 1.1s ease-in-out infinite alternate"></i></div>
      </div>
      <style>@keyframes ld{from{transform:translateX(-60%)}to{transform:translateX(210%)}}</style>
    </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
